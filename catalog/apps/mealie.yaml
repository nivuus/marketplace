# Mealie - Recipe Manager
id: mealie
name: Mealie
category: web
description: Self-hosted recipe manager and meal planner with shopping lists
icon: mdi:food
version: "latest"
maintainer: Mealie
website: https://mealie.io
documentation: https://docs.mealie.io

tags:
  - recipes
  - cooking
  - meal-planning
  - self-hosted

requirements:
  min_memory: 512
  recommended_memory: 1024

ports:
  - container: 9000
    host: 9925
    protocol: tcp
    description: Mealie Web Interface

compose_raw:
  services:
    mealie:
      image: ghcr.io/mealie-recipes/mealie:latest
      container_name: mealie
      restart: always
      labels:
        com.centurylinklabs.watchtower.enable: "true"
        docker_marketplace.app_id: mealie
        docker_marketplace.managed: "true"
      ports:
        - "9925:9000"
      deploy:
        resources:
          limits:
            memory: 1000M
      volumes:
        - /opt/nivuus/Mealie/data:/app/data
      environment:
        - ALLOW_SIGNUP=false
        - PUID=1000
        - PGID=1000
        - TZ=Europe/Paris
        - BASE_URL=https://mealie.allanic.me
        - DB_ENGINE=postgres
        - POSTGRES_USER=mealie
        - POSTGRES_PASSWORD=mealie
        - POSTGRES_SERVER=mealie-postgres
        - POSTGRES_PORT=5432
        - POSTGRES_DB=mealie
      depends_on:
        mealie-postgres:
          condition: service_healthy

    mealie-postgres:
      image: postgres:15
      container_name: mealie-postgres
      restart: always
      labels:
        com.centurylinklabs.watchtower.enable: "true"
      volumes:
        - /opt/nivuus/Mealie/pgdata:/var/lib/postgresql/data
      environment:
        - POSTGRES_PASSWORD=mealie
        - POSTGRES_USER=mealie
        - POSTGRES_DB=mealie
      healthcheck:
        test: ["CMD", "pg_isready", "-U", "mealie"]
        interval: 30s
        timeout: 20s
        retries: 3
