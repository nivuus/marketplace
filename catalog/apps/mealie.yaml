# Mealie - Recipe Manager
id: mealie
name: Mealie
category: web
description: Self-hosted recipe manager and meal planner with shopping lists
icon: mdi:food
version: "latest"
maintainer: Mealie
website: https://mealie.io
documentation: https://docs.mealie.io

tags:
  - recipes
  - cooking
  - meal-planning
  - self-hosted

requirements:
  min_memory: 512
  recommended_memory: 1024

ports:
  - container: 9000
    host: 9925
    protocol: tcp
    description: Mealie Web Interface

# NOT INSTALLABLE AS SHIPPED. The raw-compose form has no way to take a
# per-install value: the integration copies compose_raw verbatim and does not
# interpolate the .env file it writes. A working database password, or the
# public URL of an instance, therefore cannot live in this public file.
# POSTGRES_PASSWORD is deliberately empty, so the postgres container refuses
# to initialise; BASE_URL is omitted (Mealie then uses its own default).
# This entry stays non-functional until the catalogue format supports
# per-install secrets for raw-compose stacks.
compose_raw:
  services:
    mealie:
      image: ghcr.io/mealie-recipes/mealie:latest
      container_name: mealie
      restart: always
      labels:
        com.centurylinklabs.watchtower.enable: "true"
        docker_marketplace.app_id: mealie
        docker_marketplace.managed: "true"
      ports:
        - "9925:9000"
      deploy:
        resources:
          limits:
            memory: 1000M
      volumes:
        - /opt/nivuus/Mealie/data:/app/data
      environment:
        - ALLOW_SIGNUP=false
        - PUID=1000
        - PGID=1000
        - TZ=Europe/Paris
        - DB_ENGINE=postgres
        - POSTGRES_USER=mealie
        # Per-install secret: left empty on purpose (see the note at the top).
        - POSTGRES_PASSWORD=
        - POSTGRES_SERVER=mealie-postgres
        - POSTGRES_PORT=5432
        - POSTGRES_DB=mealie
      depends_on:
        mealie-postgres:
          condition: service_healthy

    mealie-postgres:
      image: postgres:15
      container_name: mealie-postgres
      restart: always
      labels:
        com.centurylinklabs.watchtower.enable: "true"
      volumes:
        - /opt/nivuus/Mealie/pgdata:/var/lib/postgresql/data
      environment:
        # Per-install secret: left empty on purpose (see the note at the top).
        - POSTGRES_PASSWORD=
        - POSTGRES_USER=mealie
        - POSTGRES_DB=mealie
      healthcheck:
        test: ["CMD", "pg_isready", "-U", "mealie"]
        interval: 30s
        timeout: 20s
        retries: 3
