version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    # Production dependencies are bundled into the shipped panel, so their
    # bumps must be releasable: the shared release script only cuts a
    # release for fix/perf/refactor/feat subjects. Development dependencies
    # (the build toolchain) keep chore.
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
