# Matter Server - Home Automation Protocol
id: matter-server
name: Matter Server
category: smart_home
description: Python Matter Server for Home Assistant Matter/Thread device integration
icon: mdi:home-automation
version: "stable"
maintainer: Home Assistant
website: https://github.com/home-assistant-libs/python-matter-server
documentation: https://www.home-assistant.io/integrations/matter/

tags:
  - matter
  - thread
  - smart-home
  - iot

requirements:
  min_memory: 256
  recommended_memory: 512

volumes:
  - name: data
    container: /data
    default_host: /opt/nivuus/HomeAssistant/matter
    description: Matter server data directory

environment:
  - name: TZ
    default: "Europe/Paris"
    description: Timezone

compose:
  image: ghcr.io/home-assistant-libs/python-matter-server:stable
  restart: unless-stopped
  network_mode: host
