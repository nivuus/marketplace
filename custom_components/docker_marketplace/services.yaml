install_app:
  name: Install App
  description: Install an app from the Docker Marketplace catalog
  fields:
    app_id:
      name: App ID
      description: The app identifier from the catalog
      required: true
      example: "plex"
      selector:
        text:
    config:
      name: Configuration
      description: Optional configuration overrides (ports, volumes, environment)
      required: false
      selector:
        object:

remove_app:
  name: Remove App
  description: Remove an installed app
  fields:
    app_id:
      name: App ID
      description: The app identifier to remove
      required: true
      example: "plex"
      selector:
        text:
    remove_data:
      name: Remove Data
      description: Also remove associated volumes and data
      required: false
      default: false
      selector:
        boolean:

update_app:
  name: Update App
  description: Pull latest image and restart the app
  fields:
    app_id:
      name: App ID
      description: The app identifier to update
      required: true
      example: "plex"
      selector:
        text:

start_app:
  name: Start App
  description: Start an installed app
  fields:
    app_id:
      name: App ID
      description: The app identifier to start
      required: true
      example: "plex"
      selector:
        text:

stop_app:
  name: Stop App
  description: Stop a running app
  fields:
    app_id:
      name: App ID
      description: The app identifier to stop
      required: true
      example: "plex"
      selector:
        text:

restart_app:
  name: Restart App
  description: Restart a running app
  fields:
    app_id:
      name: App ID
      description: The app identifier to restart
      required: true
      example: "plex"
      selector:
        text:
