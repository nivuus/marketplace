# Mosquitto - MQTT Broker
id: mosquitto
name: Mosquitto
category: smart_home
description: Eclipse Mosquitto MQTT broker for IoT and home automation
icon: mdi:access-point-network
version: "latest"
maintainer: Eclipse Foundation
website: https://mosquitto.org
documentation: https://mosquitto.org/documentation/

tags:
  - mqtt
  - iot
  - home-automation
  - broker

requirements:
  min_memory: 64
  recommended_memory: 128

ports:
  - container: 1883
    host: 1883
    protocol: tcp
    description: MQTT Default Port
  - container: 1884
    host: 1884
    protocol: tcp
    description: MQTT Secondary Port
  - container: 8883
    host: 8883
    protocol: tcp
    description: MQTT over TLS
  - container: 8884
    host: 8884
    protocol: tcp
    description: MQTT over TLS Secondary

volumes:
  - name: data
    container: /mosquitto/data
    default_host: /opt/nivuus/HomeAssistant/mosquitto
    description: Mosquitto data directory
  - name: config
    container: /mosquitto/config/mosquitto.conf
    default_host: /opt/nivuus/HomeAssistant/mosquitto/mosquitto.conf
    description: Mosquitto configuration file

compose:
  image: eclipse-mosquitto:latest
  restart: always
